<svg width="100%" viewBox="0 0 1000 780" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>RFC 3261 Figure 1：SIP 梯形拓扑下的一次完整呼叫</title>
  <desc>Alice 的软电话经 atlanta.com 与 biloxi.com 两个代理呼叫 Bob：INVITE F1–F4、100 Trying F3/F5、180 Ringing F6–F8、200 OK F9–F11、端到端 ACK F12、媒体、Bob 发起的 BYE F13、200 OK F14。</desc>
  <defs>
    <style>
      .dg-th { font: 600 13px -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
      .dg-ts { font: 12px -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
      .dg-tn { font: 11px -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
      .dg-tm { font: 12px -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
      .dg-arr { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
      .dg-arr2 { fill: none; stroke: #B4B2A9; stroke-width: 1.5; }
      .dg-arr3 { fill: none; stroke: #0F6E56; stroke-width: 1.5; }
      .dg-lane { stroke: #B4B2A9; stroke-width: 1; stroke-dasharray: 4 4; }
      .dg-band { fill: #F1EFE8; stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 5 5; }
    </style>
    <marker id="dg-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="dg-ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="dg-ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 域分组带 -->
  <rect class="dg-band" x="30" y="8" width="500" height="72" rx="12"/>
  <rect class="dg-band" x="540" y="8" width="440" height="72" rx="12"/>
  <text class="dg-tn" x="46" y="30" fill="#B4B2A9">atlanta.com</text>
  <text class="dg-tn" x="556" y="30" fill="#B4B2A9">biloxi.com</text>

  <!-- 生命线 -->
  <path class="dg-lane" d="M130 80L130 700"/>
  <path class="dg-lane" d="M380 80L380 700"/>
  <path class="dg-lane" d="M630 80L630 700"/>
  <path class="dg-lane" d="M880 80L880 700"/>

  <!-- 参与者 -->
  <rect x="40" y="36" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="dg-th" x="130" y="50" text-anchor="middle" dominant-baseline="central" fill="#444441">Alice 的软电话</text>
  <text class="dg-tn" x="130" y="68" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">UAC · pc33</text>

  <rect x="290" y="36" width="180" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="dg-th" x="380" y="50" text-anchor="middle" dominant-baseline="central" fill="#085041">代理 P1</text>
  <text class="dg-tn" x="380" y="68" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">atlanta.com</text>

  <rect x="540" y="36" width="180" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="dg-th" x="630" y="50" text-anchor="middle" dominant-baseline="central" fill="#085041">代理 P2</text>
  <text class="dg-tn" x="630" y="68" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">biloxi.com</text>

  <rect x="790" y="36" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="dg-th" x="880" y="50" text-anchor="middle" dominant-baseline="central" fill="#444441">Bob 的 SIP 电话</text>
  <text class="dg-tn" x="880" y="68" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">UAS · biloxi</text>

  <!-- 请求：逐跳 -->
  <path class="dg-arr" d="M130 130L380 130" marker-end="url(#dg-ar)"/>
  <text class="dg-tm" x="255" y="118" text-anchor="middle" fill="#444441">INVITE F1</text>

  <path class="dg-arr" d="M380 166L630 166" marker-end="url(#dg-ar)"/>
  <text class="dg-tm" x="505" y="154" text-anchor="middle" fill="#444441">INVITE F2</text>

  <path class="dg-arr" d="M630 238L880 238" marker-end="url(#dg-ar)"/>
  <text class="dg-tm" x="755" y="226" text-anchor="middle" fill="#444441">INVITE F4</text>

  <!-- 响应：逐跳回传 -->
  <path class="dg-arr" d="M380 202L130 202" marker-end="url(#dg-ar)"/>
  <text class="dg-tm" x="255" y="190" text-anchor="middle" fill="#5F5E5A">100 Trying F3</text>

  <path class="dg-arr" d="M630 274L380 274" marker-end="url(#dg-ar)"/>
  <text class="dg-tm" x="505" y="262" text-anchor="middle" fill="#5F5E5A">100 Trying F5</text>

  <path class="dg-arr" d="M880 310L630 310" marker-end="url(#dg-ar)"/>
  <text class="dg-tm" x="755" y="298" text-anchor="middle" fill="#5F5E5A">180 Ringing F6</text>

  <path class="dg-arr" d="M630 346L380 346" marker-end="url(#dg-ar)"/>
  <text class="dg-tm" x="505" y="334" text-anchor="middle" fill="#5F5E5A">180 Ringing F7</text>

  <path class="dg-arr" d="M380 382L130 382" marker-end="url(#dg-ar)"/>
  <text class="dg-tm" x="255" y="370" text-anchor="middle" fill="#5F5E5A">180 Ringing F8</text>

  <path class="dg-arr" d="M880 418L630 418" marker-end="url(#dg-ar)"/>
  <text class="dg-tm" x="755" y="406" text-anchor="middle" fill="#5F5E5A">200 OK F9</text>

  <path class="dg-arr" d="M630 454L380 454" marker-end="url(#dg-ar)"/>
  <text class="dg-tm" x="505" y="442" text-anchor="middle" fill="#5F5E5A">200 OK F10</text>

  <path class="dg-arr" d="M380 490L130 490" marker-end="url(#dg-ar)"/>
  <text class="dg-tm" x="255" y="478" text-anchor="middle" fill="#5F5E5A">200 OK F11</text>

  <!-- 端到端：ACK / 媒体 / BYE / 200 OK -->
  <path class="dg-arr3" d="M130 526L880 526" marker-end="url(#dg-ar3)"/>
  <text class="dg-tm" x="505" y="514" text-anchor="middle" fill="#085041">ACK F12</text>

  <path class="dg-arr3" d="M130 566L880 566" marker-start="url(#dg-ar3)" marker-end="url(#dg-ar3)"/>
  <text class="dg-tm" x="505" y="554" text-anchor="middle" fill="#085041">Media Session（RTP，双向）</text>

  <path class="dg-arr3" d="M880 612L130 612" marker-end="url(#dg-ar3)"/>
  <text class="dg-tm" x="505" y="600" text-anchor="middle" fill="#085041">BYE F13</text>

  <path class="dg-arr3" d="M130 648L880 648" marker-end="url(#dg-ar3)"/>
  <text class="dg-tm" x="505" y="636" text-anchor="middle" fill="#085041">200 OK F14</text>

  <!-- 图例与脚注 -->
  <path class="dg-arr" d="M40 726L80 726" marker-end="url(#dg-ar)"/>
  <text class="dg-tn" x="90" y="726" dominant-baseline="central" fill="#5F5E5A">逐跳：每过一跳代理都要重新生成请求/响应（F1–F11）</text>

  <path class="dg-arr3" d="M40 750L80 750" marker-end="url(#dg-ar3)"/>
  <text class="dg-tn" x="90" y="750" dominant-baseline="central" fill="#085041">端到端：按 route set 直达对端（F12–F14 + 媒体）</text>

  <text class="dg-tn" x="500" y="750" text-anchor="middle" fill="#B4B2A9">虚线 = 生命线；箭头方向 = 消息方向</text>
</svg>
