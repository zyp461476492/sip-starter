<svg width="100%" viewBox="0 0 760 620" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>一次基本 SIP 呼叫的时序</title>
  <desc>Alice 经代理呼叫 Bob：INVITE、100 Trying、180 Ringing、200 OK、ACK、BYE。标注哪些消息属于 INVITE 事务、哪些属于对话。</desc>
  <defs>
    <style>
      .dg-th { font: 600 13px -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
      .dg-ts { font: 12px -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
      .dg-tn { font: 11px -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
      .dg-tm { font: 12px -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
      .dg-arr { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
      .dg-arr2 { fill: none; stroke: #B4B2A9; stroke-width: 1.5; }
      .dg-lane { stroke: #B4B2A9; stroke-width: 1; stroke-dasharray: 4 4; }
    </style>
    <marker id="dg-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="dg-ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 生命线 -->
  <path class="dg-lane" d="M120 72L120 520"/>
  <path class="dg-lane" d="M380 72L380 520"/>
  <path class="dg-lane" d="M640 72L640 520"/>

  <!-- 参与者 -->
  <rect x="35" y="16" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="dg-th" x="120" y="36" text-anchor="middle" dominant-baseline="central" fill="#444441">Alice</text>
  <text class="dg-ts" x="120" y="55" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">UAC</text>

  <rect x="295" y="16" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="dg-th" x="380" y="36" text-anchor="middle" dominant-baseline="central" fill="#085041">代理</text>
  <text class="dg-ts" x="380" y="55" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">atlanta.com</text>

  <rect x="555" y="16" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="dg-th" x="640" y="36" text-anchor="middle" dominant-baseline="central" fill="#444441">Bob</text>
  <text class="dg-ts" x="640" y="55" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">UAS</text>

  <!-- INVITE 事务范围 -->
  <path class="dg-arr" d="M120 110L380 110" marker-end="url(#dg-ar)"/>
  <text class="dg-tm" x="250" y="98" text-anchor="middle" fill="#444441">INVITE</text>

  <path class="dg-arr" d="M380 150L120 150" marker-end="url(#dg-ar)"/>
  <text class="dg-tm" x="250" y="138" text-anchor="middle" fill="#444441">100 Trying</text>

  <path class="dg-arr" d="M380 190L640 190" marker-end="url(#dg-ar)"/>
  <text class="dg-tm" x="510" y="178" text-anchor="middle" fill="#444441">INVITE</text>

  <path class="dg-arr" d="M640 230L380 230" marker-end="url(#dg-ar)"/>
  <text class="dg-tm" x="510" y="218" text-anchor="middle" fill="#444441">180 Ringing</text>

  <path class="dg-arr" d="M640 270L380 270" marker-end="url(#dg-ar)"/>
  <text class="dg-tm" x="510" y="258" text-anchor="middle" fill="#444441">200 OK</text>

  <path class="dg-arr" d="M380 310L120 310" marker-end="url(#dg-ar)"/>
  <text class="dg-tm" x="250" y="298" text-anchor="middle" fill="#444441">200 OK</text>

  <!-- ACK：2xx 之后由 UAC core 生成 -->
  <path class="dg-arr" d="M120 360L640 360" marker-end="url(#dg-ar)"/>
  <text class="dg-tm" x="380" y="348" text-anchor="middle" fill="#444441">ACK</text>
  <text class="dg-tn" x="380" y="380" text-anchor="middle" fill="#5F5E5A">此 ACK 不属于 INVITE 事务（§17）</text>

  <!-- 对话内请求 -->
  <path class="dg-arr" d="M640 440L120 440" marker-end="url(#dg-ar)"/>
  <text class="dg-tm" x="380" y="428" text-anchor="middle" fill="#444441">BYE</text>

  <path class="dg-arr" d="M120 480L640 480" marker-end="url(#dg-ar)"/>
  <text class="dg-tm" x="380" y="468" text-anchor="middle" fill="#444441">200 OK</text>

  <!-- 对话区间示意 -->
  <path class="dg-arr2" d="M700 296L700 456" marker-end="url(#dg-ar2)"/>
  <text class="dg-tn" x="712" y="376" text-anchor="middle" fill="#B4B2A9" transform="rotate(90 712 376)">对话（dialog）</text>

  <text class="dg-tn" x="38" y="560" fill="#5F5E5A">简化自 RFC 3261 §24.2 Figure 1：省略 DNS 查询、Record-Route 与第二跳代理</text>
  <text class="dg-tn" x="38" y="582" fill="#B4B2A9">虚线 = 参与者生命周期；箭头方向 = 消息方向；每跳都追加 Via</text>
</svg>
