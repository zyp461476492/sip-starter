- term: retransmission
  pos: noun
  phonetic: /ˌriːtrænzˈmɪʃən/
  general_meaning: The act of sending again.
  domain_meaning: UDP 下由事务层负责的重发：客户端事务按 T1 起倍增重发请求（非 INVITE 封顶 T2），服务端事务在收到重传时重发上一次的响应；可靠传输（TCP/TLS）不重发请求
  confusion: 以为重传是 UDP/传输层的事；实际是事务层的职责，且 2xx 响应由 UAS 端到端重传、由 ACK 抑制，与事务层的请求重传是两套机制
  source: RFC3261 §17.1.1.1
