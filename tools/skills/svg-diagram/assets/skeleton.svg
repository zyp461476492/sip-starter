<svg width="100%" viewBox="0 0 720 360" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>骨架</title>
  <desc>最小可用骨架：两行标题 + 一个强调盒子 + 一条带箭头的连线。复制后改内容。</desc>
  <defs>
    <style>
      .th { font: 600 13px -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
      .ts { font: 12px -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
      .tn { font: 11px -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
      .tm { font: 12px -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
      .arr { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
      .arr2 { fill: none; stroke: #B4B2A9; stroke-width: 1.5; }
      .lane { stroke: #B4B2A9; stroke-width: 1; stroke-dasharray: 4 4; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="140" y="62" text-anchor="middle" dominant-baseline="central" fill="#444441">标题</text>
  <text class="ts" x="140" y="82" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">副标题</text>

  <path class="arr" d="M240 68L380 68" marker-end="url(#ar)"/>
  <text class="tn" x="310" y="56" text-anchor="middle" fill="#5F5E5A">连线说明</text>

  <rect x="384" y="40" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="484" y="62" text-anchor="middle" dominant-baseline="central" fill="#085041">强调</text>
  <text class="ts" x="484" y="82" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">核心模块</text>

  <text class="tn" x="40" y="330" fill="#B4B2A9">脚注：数据来源 / 适用范围</text>
</svg>
